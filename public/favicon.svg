<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="a" gradientUnits="userSpaceOnUse" x1="10" y1="42" x2="27" y2="25">
      <stop offset="0" stop-color="#ff3d3d" stop-opacity="0" />
      <stop offset="1" stop-color="#ff3d3d" />
    </linearGradient>
    <linearGradient id="b" gradientUnits="userSpaceOnUse" x1="33" y1="9" x2="52" y2="20">
      <stop offset="0" stop-color="#ffbf3d" stop-opacity="0" />
      <stop offset="1" stop-color="#ffbf3d" />
    </linearGradient>
    <linearGradient id="c" gradientUnits="userSpaceOnUse" x1="13" y1="55" x2="33" y2="47">
      <stop offset="0" stop-color="#3dff7e" stop-opacity="0" />
      <stop offset="1" stop-color="#3dff7e" />
    </linearGradient>
    <linearGradient id="d" gradientUnits="userSpaceOnUse" x1="55" y1="52" x2="41" y2="33">
      <stop offset="0" stop-color="#de3dff" stop-opacity="0" />
      <stop offset="1" stop-color="#de3dff" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#000000" />

  <!-- Wide pass first: a filter-free stand in for the glow around each streak. -->
  <g fill="none" stroke-linecap="round" stroke-width="15" opacity="0.2">
    <line x1="10" y1="42" x2="27" y2="25" stroke="url(#a)" />
    <line x1="33" y1="9" x2="52" y2="20" stroke="url(#b)" />
    <line x1="13" y1="55" x2="33" y2="47" stroke="url(#c)" />
    <line x1="55" y1="52" x2="41" y2="33" stroke="url(#d)" />
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="8">
    <line x1="10" y1="42" x2="27" y2="25" stroke="url(#a)" />
    <line x1="33" y1="9" x2="52" y2="20" stroke="url(#b)" />
    <line x1="13" y1="55" x2="33" y2="47" stroke="url(#c)" />
    <line x1="55" y1="52" x2="41" y2="33" stroke="url(#d)" />
  </g>

  <!-- A still particle, which keeps a visible core in the sim. -->
  <circle cx="14" cy="16" r="3.6" fill="#3ddeff" />
</svg>
